# CI for the shadow-pr-review tool itself (lint, types, tests).
# The video-review workflow for service repos comes in Milestone 4
# (see docs/cheatsheets/github-integration.md).
# Pin actions to a version or commit SHA; verify current versions on github.com.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from package.json "packageManager")
        run: |
          npm install -g corepack@0.36.0   # bundled corepack can be too old for pnpm 12 (ADR-013)
          corepack enable
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated types are up to date
        run: pnpm check:types

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Only the headless shell, and no --with-deps: ubuntu-latest already ships Chrome,
      # Chromium and Firefox, so Playwright's system libraries are present. Measured at
      # 94 MiB and about 20 seconds, which is why there is no actions/cache here - a full
      # install is 567 MB on disk, and saving and restoring that is plausibly slower than
      # downloading it again (ADR-031).
      - name: Install Chromium for the Recorder
        run: pnpm exec playwright install chromium-headless-shell

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
